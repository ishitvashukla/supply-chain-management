# Render blueprint — free plan, native Node (no Docker).
#
# One web service serves both: the build compiles the SPA into
# backend/public/client and the API serves it from there, so there is a single
# URL, no CORS, and nothing to keep in step between two deployments.
#
# A free service sleeps after ~15 minutes idle and takes ~30s to wake. Fine for
# testing; it is not a production plan.
services:
  - type: web
    name: supply-chain-management
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # Set this in the dashboard — it holds the database password.
      - key: MONGO_URI
        sync: false

      # Generated once by Render and kept stable across deploys.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 3d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d

      - key: TURNS_BASE_URL
        value: https://{BUSINESS_ID}.turnsapp.com/
      - key: TURNS_APP_NAME
        value: 1.0.0.0
      - key: TURNS_APP_VERSION
        value: "10000"
      - key: TURNS_OS_VERSION
        value: "24"

      # The SPA is served from this same origin, so nothing is cross-origin.
      - key: CORS_ORIGIN
        value: "*"
